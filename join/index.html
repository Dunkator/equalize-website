<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join an Equalize household</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F1A2E;
      color: #E8ECF1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card { text-align: center; max-width: 380px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 15px; color: #A0AABB; margin-bottom: 16px; }
    .code { color: #E8ECF1; font-weight: 700; word-break: break-word; }
    .badges { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .badges a img { height: 44px; }
  </style>
  <script>
    (function () {
      var parts = window.location.pathname.split('/');
      var code = parts.length >= 3 ? parts[2] : '';
      var codeElement = document.getElementById('invite-code');
      if (code && codeElement) {
        codeElement.textContent = code;
        document.getElementById('invite-details').hidden = false;
      }

      if (/android/i.test(navigator.userAgent || '')) {
        window.location.replace(
          'https://play.google.com/store/apps/details?id=com.equalizehousehold.app'
        );
      }
    })();
  </script>
</head>
<body>
  <main class="card">
    <h1>Join an Equalize household</h1>
    <p>Download Equalize to join your household and start sharing money, chores and plans.</p>
    <p id="invite-details" hidden>Your invite code: <span id="invite-code" class="code"></span></p>
    <div class="badges">
      <a href="https://play.google.com/store/apps/details?id=com.equalizehousehold.app">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
             alt="Get it on Google Play">
      </a>
    </div>
  </main>
</body>
</html>
